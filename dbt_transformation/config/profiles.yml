
dbt_transformation:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('DBT_BIGQUERY_PROJECT') }}"
      dataset: "{{ env_var('DBT_BIGQUERY_DATASET') }}"
      threads: 1
      keyfile: "{{ env_var('DBT_BIGQUERY_KEYFILE_PATH') }}"
      location: "{{ env_var('DBT_BIGQUERY_LOCATION') }}"
